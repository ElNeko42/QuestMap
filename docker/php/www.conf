[www]
; Dev-only: run the FPM pool as root so it can write to the bind-mounted
; storage/ and bootstrap/cache directories (owned by root on the host).
; In production these paths are chown'ed to www-data and this override is dropped.
user = root
group = root
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = no
